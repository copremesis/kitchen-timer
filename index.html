<html>
  <head>
    <!--remove this dep overkill for two classes-->
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="css/current.css">
    <!--fake ico keeps noise from happening from browser client-->
    <link rel="icon" href="data:,">
  </head>
  <body>
    <h6> persistent kitchen timer </h6>
    <div id="timers" class="panel">
<!--simple-->
      <form name="nextTimer">
        <input name="nextItem" type="text" placeholder="Pizza"/>
        <input name="nextAmount" type="number" placeholder="60"/>
        <select name="nextUnit">
          <option value="seconds"> seconds </option>
          <option value="minutes"> minutes </option>
          <option value="hours"> hours </option>
          <option value="days"> days </option>
        </select>
        <button name="add">&#x2B;</button>
      </form>
<!--simple-->
      <div id="app"></div>

      <input id="amount" type="number">
      <select id="unit">
        <option value="seconds"> seconds </option>
        <option value="hours"> hours </option>
        <option value="days"> days </option>
      </select>
      <select id="direction">
        <option value="from_now"> from now </option>
        <option value="ago"> ago </option>
      </select>
      <span id="result"></span>
      <script>
        let g = (id) => document.getElementById(id);
          g('amount').onchange =
          g('unit').onchange =
          g('direction').onchange = () => {
            g('result').innerHTML = (parseInt(g('amount').value))
                                    .send(g('unit').value)
                                    .send(g('direction').value)
                                    .to_human()
        }
      </script>
    </div>
  </body>
  <script src="js/number.js"></script>
  <script src="js/model.js"> </script>
  <script src="js/notify.js"> </script>
  <script src="js/timer.js"> </script>
  <script src="js/local-storage.js"> </script>
  <script src="js/kitchen-manager.js"> </script>
  <script src="js/main.js"> </script>
</html>
